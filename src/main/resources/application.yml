server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/autoinvoice
    username: postgres
    password: yourpassword
  jpa:
    hibernate:
    ddl-auto: update
    show-sql: false
    

auth0:
  domain: ${AUTH0_DOMAIN}
  client-id: ${AUTH0_CLIENT_ID}
  client-secret: ${AUTH0_CLIENT_SECRET}
  audience: ${AUTH0_AUDIENCE}
  login-redirect-uri: http://localhost:8080/api/session/callback
  connection-redirect-uri: http://localhost:8080/api/auth/callback

gmail:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  base-url: https://api.paystack.co

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: http://localhost:8080/api/auth/callback
  calendar:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4o

agent:
  approval-threshold-ngn: 150000
  scan-interval-ms: 900000
  
app:
  frontend-url: http://localhost:5173

encryption:
  secret: ${ENCRYPTION_SECRET}
